<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="0TZ-Li2FetkG12f3W-B5X5mEkd8HSJyv3YTUf8C3seU" />
<title>Alca Rusuh Webhook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#09090b;--panel:#0f0f11;--border:#27272a;--border2:#3f3f46;
    --fg:#d4d4d8;--fg2:#a1a1aa;--fg3:#71717a;--fg4:#52525b;
    --emerald:#10b981;--emerald2:#34d399;--rose:#f43f5e;--amber:#f59e0b;--blue:#60a5fa;
  }
  body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;padding:24px;font-size:14px;line-height:1.5}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#3f3f4680;border-radius:9999px}
  ::-webkit-scrollbar-thumb:hover{background:#a1a1aa80}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;
    padding-bottom:16px;border-bottom:1px solid var(--border)}
  h1{font-size:18px;font-weight:600;letter-spacing:-.02em;color:#fafafa}
  h1 span{color:var(--emerald2)}
  .status{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--fg4);transition:.2s}
  .dot.on{background:var(--emerald);box-shadow:0 0 10px #10b98166}
  .dot.err{background:var(--rose);box-shadow:0 0 10px #f43f5e66}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:960px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px}
  .panel h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.15em;
    color:var(--fg3);margin-bottom:16px;font-family:'JetBrains Mono',monospace}
  label{display:block;font-size:11px;color:var(--fg3);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.05em;font-family:'JetBrains Mono',monospace}
  input,textarea,select{width:100%;background:#09090b;border:1px solid var(--border);
    border-radius:6px;padding:10px 12px;color:var(--fg);font-family:'JetBrains Mono',monospace;
    font-size:12px;outline:none;transition:.15s}
  input:focus,textarea:focus,select:focus{border-color:var(--border2)}
  textarea{resize:vertical;min-height:80px;line-height:1.5}
  .field{margin-bottom:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{background:#18181b;border:1px solid var(--border);border-radius:6px;padding:10px 14px;
    color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    cursor:pointer;transition:.15s;width:100%;text-align:center}
  .btn:hover{background:#27272a;border-color:var(--border2);color:#fafafa}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn.primary{background:linear-gradient(90deg,#059669,#10b981,#2dd4bf);color:#000;
    border:0;font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.danger{background:#1c0a0e;border-color:#7f1d1d;color:#fca5a5}
  .btn.danger:hover{background:#3f0f18;border-color:#991b1b;color:#fecaca}
  .btn.warn{background:#1c1408;border-color:#78350f;color:#fcd34d}
  .btn.warn:hover{background:#3f2a0a;border-color:#92400e}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .btns.full{grid-template-columns:1fr}
  .btns.three{grid-template-columns:1fr 1fr 1fr}
  .console{background:#000;border:1px solid var(--border);border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:14px;
    height:640px;overflow-y:auto;line-height:1.7}
  .log{padding:3px 0;border-bottom:1px solid #18181b;word-break:break-all;
    display:flex;gap:10px;align-items:flex-start}
  .log:last-child{border-bottom:0}
  .log .ts{color:var(--fg4);flex-shrink:0}
  .log .tag{flex-shrink:0;font-weight:600;width:52px}
  .log .tag.req{color:var(--blue)}
  .log .tag.ok{color:var(--emerald2)}
  .log .tag.err{color:var(--rose)}
  .log .tag.warn{color:var(--amber)}
  .log .tag.sys{color:var(--fg3)}
  .log .msg{color:var(--fg2);flex:1;white-space:pre-wrap}
  .log.ok .msg{color:#a7f3d0}
  .log.err .msg{color:#fecaca}
  .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;
    background:#27272a;color:var(--fg2);margin-left:6px}
  .badge.em{background:#064e3b;color:#6ee7b7}
  .hint{font-size:10px;color:var(--fg4);margin-top:4px;font-family:'JetBrains Mono',monospace}
  .tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tab{background:transparent;border:0;color:var(--fg3);font-family:'JetBrains Mono',monospace;
    font-size:11px;padding:8px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--emerald2);border-bottom-color:var(--emerald)}
  .tab-content{display:none}
  .tab-content.active{display:block}
  .file-info{font-size:10px;color:var(--fg4);font-family:'JetBrains Mono',monospace;margin-top:4px}
  .prog{height:4px;background:#18181b;border-radius:99px;overflow:hidden;margin-top:6px;display:none}
  .prog.on{display:block}
  .prog > div{height:100%;background:linear-gradient(90deg,#059669,#10b981);width:0%;transition:width .2s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Alca<span>W44</span> <span class="badge">Beta Version</span></h1>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">idle</span>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="panel" style="margin-bottom:20px">
        <h2>target</h2>
        <div class="field">
          <label>webhook url / id+token</label>
          <input id="webhookUrl" placeholder="https://discord.com/api/webhooks/ID/TOKEN" autocomplete="off">
          <div class="hint">format: https://discord.com/api/webhooks/{id}/{token}</div>
        </div>
        <div class="btns">
          <button class="btn" onclick="act.fetchInfo()">fetch info</button>
          <button class="btn" onclick="act.ping()">ping (test)</button>
        </div>
        <div class="btns full" style="margin-top:8px">
          <button class="btn" onclick="ui.saveUrl()">simpan url</button>
        </div>
      </div>

      <div class="panel">
        <h2>actions</h2>
        <div class="tabs">
          <button class="tab active" data-tab="msg">message</button>
          <button class="tab" data-tab="embed">embed</button>
          <button class="tab" data-tab="file">file</button>
          <button class="tab" data-tab="webhook">webhook</button>
        </div>

        <div class="tab-content active" id="tab-msg">
          <div class="field">
            <label>username override</label>
            <input id="msgUser" placeholder="Captain Hook">
          </div>
          <div class="field">
            <label>avatar url override</label>
            <input id="msgAvatar" placeholder="https://...">
          </div>
          <div class="field">
            <label>content</label>
            <textarea id="msgContent" placeholder="@everyone **FROM W44** ```IDIOT BENER BIKIN KEYLOGGER TOLOL```"></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label>tts</label>
              <select id="msgTts"><option value="false">false</option><option value="true">true</option></select>
            </div>
            <div class="field">
              <label>thread_name (forum only)</label>
              <input id="msgThread" placeholder="optional">
            </div>
          </div>
          <div class="btns">
            <button class="btn primary" onclick="act.sendMessage()">send message</button>
            <button class="btn warn" onclick="act.sendWithFlags()">send + suppress embeds</button>
          </div>
          <div class="btns full" style="margin-top:8px">
            <button class="btn danger" onclick="act.spamMessage()">spam (loop)</button>
          </div>
          <div class="row" style="margin-top:8px">
            <div class="field" style="margin:0">
              <label>spam count</label>
              <input id="spamCount" type="number" value="10" min="1" max="100">
            </div>
            <div class="field" style="margin:0">
              <label>delay (ms)</label>
              <input id="spamDelay" type="number" value="500" min="0" max="10000">
            </div>
          </div>
          <div class="prog" id="spamProg"><div></div></div>
        </div>

        <div class="tab-content" id="tab-embed">
          <div class="field">
            <label>title</label>
            <input id="embTitle" placeholder="Judul embed">
          </div>
          <div class="field">
            <label>description</label>
            <textarea id="embDesc" placeholder="Isi embed..."></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label>color (hex)</label>
              <input id="embColor" placeholder="#10b981" value="#10b981">
            </div>
            <div class="field">
              <label>url</label>
              <input id="embUrl" placeholder="https://...">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>image url</label>
              <input id="embImage" placeholder="https://...">
            </div>
            <div class="field">
              <label>thumbnail url</label>
              <input id="embThumb" placeholder="https://...">
            </div>
          </div>
          <div class="field">
            <label>footer text</label>
            <input id="embFooter" placeholder="footer">
          </div>
          <div class="btns full">
            <button class="btn primary" onclick="act.sendEmbed()">send embed</button>
          </div>
        </div>

        <div class="tab-content" id="tab-file">
          <div class="field">
            <label>file (image / audio / video / any)</label>
            <input id="fileInput" type="file">
            <div class="file-info" id="fileInfo">no file selected</div>
          </div>
          <div class="field">
            <label>content (optional)</label>
            <textarea id="fileContent" placeholder="caption..."></textarea>
          </div>
          <div class="field">
            <label>url (remote file)</label>
            <input id="fileUrl" placeholder="https://example.com/image.png">
            <div class="hint">attach via URL, bukan upload lokal</div>
          </div>
          <div class="btns full">
            <button class="btn primary" onclick="act.sendFile()">send file</button>
          </div>
          <div class="prog" id="fileProg"><div></div></div>
        </div>

        <div class="tab-content" id="tab-webhook">
          <div class="field">
            <label>new name</label>
            <input id="whName" placeholder="Captain Hook">
          </div>
          <div class="field">
            <label>new avatar url</label>
            <input id="whAvatar" placeholder="https://...">
          </div>
          <div class="btns">
            <button class="btn warn" onclick="act.editWebhook()">edit webhook</button>
            <button class="btn danger" onclick="act.deleteWebhook()">DELETE webhook</button>
          </div>
          <div class="btns full" style="margin-top:8px">
            <button class="btn danger" onclick="act.deleteMessagePrompt()">delete message by id</button>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="panel" style="height:100%;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="margin:0">console</h2>
          <div style="display:flex;gap:6px">
            <button class="btn" style="width:auto;padding:4px 10px;font-size:10px" onclick="ui.exportLog()">export</button>
            <button class="btn" style="width:auto;padding:4px 10px;font-size:10px" onclick="log.clear()">clear</button>
          </div>
        </div>
        <div class="console" id="console"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ---------- LOGGER ----------
const log = {
  el: document.getElementById('console'),
  add(tag, msg, cls='') {
    const ts = new Date().toTimeString().slice(0,8);
    const div = document.createElement('div');
    div.className = 'log ' + cls;
    div.innerHTML = `<span class="ts">${ts}</span><span class="tag ${tag}">${tag.toUpperCase()}</span><span class="msg"></span>`;
    div.querySelector('.msg').textContent = msg;
    this.el.appendChild(div);
    this.el.scrollTop = this.el.scrollHeight;
  },
  req(m){this.add('req',m)},
  ok(m){this.add('ok',m,'ok')},
  err(m){this.add('err',m,'err')},
  warn(m){this.add('warn',m)},
  sys(m){this.add('sys',m)},
  clear(){this.el.innerHTML=''}
};

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.className = 'dot' + (state==='ok'?' on':state==='err'?' err':'');
  t.textContent = text;
}

// ---------- TARGET ----------
function getTarget() {
  const raw = document.getElementById('webhookUrl').value.trim();
  if (!raw) { log.err('webhook url kosong'); return null; }
  const m = raw.match(/webhooks\/(\d+)\/([\w-]+)/);
  if (m) return { id: m[1], token: m[2], base: `https://discord.com/api/v10/webhooks/${m[1]}/${m[2]}` };
  const m2 = raw.match(/^(\d+)[\/\s]+([\w-]+)$/);
  if (m2) return { id: m2[1], token: m2[2], base: `https://discord.com/api/v10/webhooks/${m2[1]}/${m2[2]}` };
  log.err('format url tidak valid');
  return null;
}

// ---------- RELAY CLIENT ----------
async function relay(webhookUrl, method, payload, opts = {}) {
  const t0 = performance.now();
  log.req(`RELAY ${method} → /api/relay`);
  try {
    const r = await fetch('/api/relay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        webhookUrl,
        method,
        body: payload || {},
        isForm: !!opts.isForm,
        fileBase64: opts.fileBase64,
        filename: opts.filename
      })
    });
    const ms = Math.round(performance.now() - t0);
    const text = await r.text();
    let data = null;
    if (text) { try { data = JSON.parse(text); } catch { data = text; } }
    const upStatus = r.headers.get('x-upstream-status') || r.status;
    const rl = r.headers.get('x-ratelimit-remaining');
    const rlReset = r.headers.get('x-ratelimit-reset-after');

    if (r.ok) {
      log.ok(`${upStatus} (${ms}ms)`);
      if (data) log.sys(JSON.stringify(data).slice(0, 500));
      setStatus('ok', `${upStatus} ok`);
    } else {
      log.err(`${upStatus} (${ms}ms)`);
      if (data) log.err(typeof data === 'string' ? data.slice(0, 500) : JSON.stringify(data).slice(0, 500));
      setStatus('err', `${upStatus} err`);
    }
    if (rl) log.sys(`ratelimit: remaining=${rl} reset_after=${rlReset}s`);
    return { ok: r.ok, status: Number(upStatus), data };
  } catch (e) {
    log.err(`relay error: ${e.message}`);
    setStatus('err', 'relay err');
    return { ok: false, status: 0 };
  }
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1]);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

function showProg(id, pct) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('on');
  el.firstElementChild.style.width = Math.min(100, Math.max(0, pct)) + '%';
}
function hideProg(id) {
  const el = document.getElementById(id);
  if (!el) return;
  setTimeout(() => { el.classList.remove('on'); el.firstElementChild.style.width = '0%'; }, 600);
}

// ---------- ACTIONS ----------
const act = {
  async fetchInfo() {
    const t = getTarget(); if (!t) return;
    log.sys('--- fetch webhook info ---');
    await relay(t.base, 'GET');
  },

  async ping() {
    const t = getTarget(); if (!t) return;
    log.sys('--- ping ---');
    await relay(t.base, 'POST', { content: 'ping', username: 'Captain Hook' });
  },

  async sendMessage() {
    const t = getTarget(); if (!t) return;
    const content = document.getElementById('msgContent').value;
    if (!content) { log.warn('content kosong'); return; }
    const body = { content };
    const u = document.getElementById('msgUser').value.trim();
    const a = document.getElementById('msgAvatar').value.trim();
    const tts = document.getElementById('msgTts').value === 'true';
    const thread = document.getElementById('msgThread').value.trim();
    if (u) body.username = u;
    if (a) body.avatar_url = a;
    if (tts) body.tts = true;
    if (thread) body.thread_name = thread;
    log.sys('--- send message ---');
    await relay(t.base, 'POST', body);
  },

  async sendWithFlags() {
    const t = getTarget(); if (!t) return;
    const content = document.getElementById('msgContent').value;
    if (!content) { log.warn('content kosong'); return; }
    const body = { content, flags: 4 };
    const u = document.getElementById('msgUser').value.trim();
    if (u) body.username = u;
    log.sys('--- send (suppress embeds) ---');
    await relay(t.base, 'POST', body);
  },

  async spamMessage() {
    const t = getTarget(); if (!t) return;
    const content = document.getElementById('msgContent').value;
    if (!content) { log.warn('content kosong'); return; }
    const count = parseInt(document.getElementById('spamCount').value) || 10;
    const delay = parseInt(document.getElementById('spamDelay').value) || 500;
    const body = { content };
    const u = document.getElementById('msgUser').value.trim();
    if (u) body.username = u;
    log.sys(`--- spam start: ${count}x, delay ${delay}ms ---`);
    let ok = 0, fail = 0;
    for (let i = 1; i <= count; i++) {
      const r = await relay(t.base, 'POST', body);
      if (r.ok) ok++; else fail++;
      showProg('spamProg', (i / count) * 100);
      if (i < count) await new Promise(x => setTimeout(x, delay));
    }
    hideProg('spamProg');
    log.sys(`--- spam done: ${ok} ok, ${fail} fail ---`);
  },

  async sendEmbed() {
    const t = getTarget(); if (!t) return;
    const embed = {};
    const title = document.getElementById('embTitle').value.trim();
    const desc = document.getElementById('embDesc').value.trim();
    const color = document.getElementById('embColor').value.trim();
    const url = document.getElementById('embUrl').value.trim();
    const image = document.getElementById('embImage').value.trim();
    const thumb = document.getElementById('embThumb').value.trim();
    const footer = document.getElementById('embFooter').value.trim();
    if (title) embed.title = title;
    if (desc) embed.description = desc;
    if (color) embed.color = parseInt(color.replace('#',''), 16);
    if (url) embed.url = url;
    if (image) embed.image = { url: image };
    if (thumb) embed.thumbnail = { url: thumb };
    if (footer) embed.footer = { text: footer };
    if (!Object.keys(embed).length) { log.warn('embed kosong'); return; }
    const body = { embeds: [embed] };
    const u = document.getElementById('msgUser').value.trim();
    if (u) body.username = u;
    log.sys('--- send embed ---');
    await relay(t.base, 'POST', body);
  },

  async sendFile() {
    const t = getTarget(); if (!t) return;
    const fileInput = document.getElementById('fileInput');
    const remote = document.getElementById('fileUrl').value.trim();
    const content = document.getElementById('fileContent').value.trim();
    const u = document.getElementById('msgUser').value.trim();

    if (!fileInput.files.length && !remote) { log.warn('pilih file atau isi url'); return; }

    if (fileInput.files.length) {
      const f = fileInput.files[0];
      if (f.size > 8 * 1024 * 1024) { log.err('file > 8MB, ditolak'); return; }
      log.sys(`--- upload file: ${f.name} (${(f.size/1024).toFixed(1)} KB) ---`);
      showProg('fileProg', 30);
      const b64 = await fileToBase64(f);
      showProg('fileProg', 70);
      const payload = { content: content || '' };
      if (u) payload.username = u;
      await relay(t.base, 'POST', payload, { isForm: true, fileBase64: b64, filename: f.name });
      showProg('fileProg', 100);
      hideProg('fileProg');
    } else {
      log.sys(`--- attach remote url: ${remote} ---`);
      const body = { content: content || '', embeds: [{ image: { url: remote } }] };
      if (u) body.username = u;
      await relay(t.base, 'POST', body);
    }
  },

  async editWebhook() {
    const t = getTarget(); if (!t) return;
    const body = {};
    const name = document.getElementById('whName').value.trim();
    const avatar = document.getElementById('whAvatar').value.trim();
    if (name) body.name = name;
    if (avatar) body.avatar = avatar;
    if (!Object.keys(body).length) { log.warn('isi name atau avatar dulu'); return; }
    log.sys('--- edit webhook ---');
    await relay(t.base, 'PATCH', body);
  },

  async deleteWebhook() {
    const t = getTarget(); if (!t) return;
    if (!confirm('Hapus webhook ini permanen?')) { log.warn('dibatalkan'); return; }
    log.sys('--- delete webhook ---');
    await relay(t.base, 'DELETE');
    setStatus('err', 'webhook deleted');
  },

  async deleteMessagePrompt() {
    const t = getTarget(); if (!t) return;
    const id = prompt('Message ID:');
    if (!id) { log.warn('dibatalkan'); return; }
    log.sys(`--- delete message ${id} ---`);
    await relay(`${t.base}/messages/${id}`, 'DELETE');
  }
};

// ---------- UI HELPERS ----------
const ui = {
  saveUrl() {
    const raw = document.getElementById('webhookUrl').value.trim();
    if (!raw) { log.warn('url kosong'); return; }
    localStorage.setItem('wh_url', raw);
    log.sys('url disimpan ke localStorage');
  },
  loadUrl() {
    const v = localStorage.getItem('wh_url');
    if (v) { document.getElementById('webhookUrl').value = v; log.sys('url dimuat dari localStorage'); }
  },
  exportLog() {
    const lines = [...document.querySelectorAll('.log')].map(l => l.textContent).join('\n');
    const blob = new Blob([lines], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `webhook-log-${Date.now()}.txt`;
    a.click();
  }
};

// ---------- TABS ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ---------- FILE INFO ----------
document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  document.getElementById('fileInfo').textContent = f
    ? `${f.name} — ${(f.size/1024).toFixed(1)} KB — ${f.type || 'unknown'}`
    : 'no file selected';
});

// ---------- KEYBOARD ----------
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); act.sendMessage(); }
});
